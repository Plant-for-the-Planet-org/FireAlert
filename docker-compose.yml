# Local PostgreSQL + PostGIS for FireAlert development.
# Matches DATABASE_URL in apps/server/.env: postgres://postgres:<password>@localhost:54321/postgres
#
# Start:  POSTGRES_PASSWORD=<password> docker compose up -d
# The image is the multi-arch (amd64 + arm64) build of postgis/postgis.
services:
  db:
    image: imresamu/postgis:17-3.5
    container_name: firealert-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "54321:5432"
    volumes:
      - firealert-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  firealert-pgdata:
